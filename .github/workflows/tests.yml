name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      aws:
        # Pinned: from 2026.7.x, localstack/localstack:latest requires a
        # LOCALSTACK_AUTH_TOKEN and exits 55 ("License activation failed")
        # without one, failing the job before any test runs. 4.6 needs no
        # credentials, and the tooling invoker's tests pin it too.
        image: "localstack/localstack:4.6"
        ports:
          - 4566

    steps:
      ###
      # Checkout using GitHub's checkout action
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9

      ###
      # Setup Ruby - this needs to match the version in the Gemfile
      - name: Set up Ruby
        uses: ruby/setup-ruby@13e7a03dc3ac6c3798f4570bfead2aed4d96abfb
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      ###
      # Install bundler and yarn dependencies
      - name: Install dependencies
        env:
          EXERCISM_ENV: test
          EXERCISM_CI: true
          AWS_PORT: ${{ job.services.aws.ports['4566'] }}
        run: |
          bundle exec setup_exercism_config
          bundle exec setup_exercism_local_aws

      ###
      # Run the tests
      - name: Run Ruby tests
        env:
          EXERCISM_ENV: test
          EXERCISM_CI: true
          AWS_PORT: ${{ job.services.aws.ports['4566'] }}
        run: |
          bundle exec rake test
